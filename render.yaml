services:
  - type: web
    name: cxone-faq-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Threaded worker: 1 process, 8 threads per request.
    # Each email call blocks ~9s on the Claude API (I/O-bound), and Render
    # free tier forces WEB_CONCURRENCY=1 anyway. Threads let one process
    # handle 8 concurrent emails instead of queueing them sequentially.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 120 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPANY_NAME
        value: The Next Street
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: BOT_API_KEY
        sync: false
      # Auto-replies are OFF unless this is "true". When off, every email
      # and chat is escalated to a human agent and Claude is never called.
      - key: AUTO_REPLY_ENABLED
        value: "false"
      - key: ESCALATION_PHRASE
        value: "[ESCALATE]"
      - key: FALLBACK_MESSAGE
        value: "I'm not sure I can help with that. Let me connect you with a team member."

  # ── QA tools (assignments + agent metrics) ───────────────────────
  # Completely separate from the bot above: own service, own key, no
  # Claude. Suspending or redeploying the bot never affects it.
  - type: web
    name: tns-qa-service
    runtime: python
    rootDir: qa
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: QA_API_KEY
        sync: false
      - key: CXONE_ACCESS_KEY_ID
        sync: false
      - key: CXONE_ACCESS_KEY_SECRET
        sync: false
      - key: CXONE_TENANT_ID
        sync: false
      - key: CXONE_BASE_URL
        value: https://api-na1.niceincontact.com
