services:
  - type: web
    name: cxone-faq-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Threaded worker: 1 process, 8 threads per request.
    # Each email call blocks ~9s on the Claude API (I/O-bound), and Render
    # free tier forces WEB_CONCURRENCY=1 anyway. Threads let one process
    # handle 8 concurrent emails instead of queueing them sequentially.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 120 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COMPANY_NAME
        value: The Next Street
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-20250514
      - key: BOT_API_KEY
        sync: false
      - key: ESCALATION_PHRASE
        value: "[ESCALATE]"
      - key: FALLBACK_MESSAGE
        value: "I'm not sure I can help with that. Let me connect you with a team member."
